<article [class]="classes()">
  <header class="border-b border-line">
    <button
      type="button"
      class="w-full px-5 py-4 text-left transition hover:bg-accent/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary"
      (click)="headerClicked.emit()"
    >
      <span class="block text-lg font-bold">{{ title() }}</span>
      @if (subtitle()) {
        <span class="block text-sm text-soft-400">{{ subtitle() }}</span>
      }
    </button>
  </header>

  <div class="px-5 py-4">
    <ng-content />
  </div>
</article>
