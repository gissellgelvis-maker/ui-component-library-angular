<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [attr.for]="selectId" class="text-sm font-semibold text-zinc-300">
      {{ label() }}
    </label>
  }

  @if (loading()) {
    <div
      class="h-10 w-full animate-pulse rounded-lg bg-line"
      role="status"
      aria-label="Cargando opciones"
    ></div>
  } @else {
    <select
      [id]="selectId"
      [disabled]="disabled()"
      (change)="onChange($event)"
      class="h-10 w-full rounded-lg border border-line-strong bg-surface px-3 text-zinc-100 transition [color-scheme:dark] enabled:hover:border-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-primary disabled:cursor-not-allowed disabled:opacity-50"
    >
      <option value="" disabled [selected]="value() === null">{{ placeholder() }}</option>
      @for (option of options(); track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">
          {{ option.label }}
        </option>
      }
    </select>
  }
</div>
