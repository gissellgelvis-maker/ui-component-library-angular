<app-modal [label]="title()" (closed)="cancelled.emit()">
  <ui-card [title]="title()" elevation="outlined">
    <p class="text-zinc-300">{{ message() }}</p>

    <div class="mt-5 flex justify-end gap-3">
      <ui-button label="Cancelar" variant="secondary" (clicked)="cancelled.emit()" />
      <ui-button [label]="confirmLabel()" variant="danger" (clicked)="confirmed.emit()" />
    </div>
  </ui-card>
</app-modal>
